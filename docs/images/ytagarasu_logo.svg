<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="cyberGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="300" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Tactical Grid Accent -->
  <path d="M 30,0 L 30,300 M 570,0 L 570,300 M 0,30 L 600,30 M 0,270 L 600,270" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Solar Disc (Sun of Kumano / Amaterasu Guide) -->
  <circle cx="300" cy="120" r="70" fill="#78350f" opacity="0.35" filter="url(#glow)"/>
  <circle cx="300" cy="120" r="54" fill="#b45309" opacity="0.45"/>
  <circle cx="300" cy="120" r="40" fill="url(#cyberGold)" opacity="0.85"/>

  <!-- Yatagarasu Body Silhouette (Raven / Crow) -->
  <g id="yatagarasu" transform="translate(300, 125)">
    <!-- Left Wing -->
    <path d="M -10,-10 C -40,-40 -100,-70 -190,-45 C -150,-20 -110,-5 -90,15 C -120,5 -150,-5 -175,10 C -140,25 -105,35 -80,45 C -105,45 -130,45 -145,58 C -115,65 -80,65 -50,60 C -30,58 -20,40 -10,20 Z" fill="url(#featherGrad)" stroke="#4a5568" stroke-width="1.5"/>
    
    <!-- Right Wing -->
    <path d="M 10,-10 C 40,-40 100,-70 190,-45 C 150,-20 110,-5 90,15 C 120,5 150,-5 175,10 C 140,25 105,35 80,45 C 105,45 130,45 145,58 C 115,65 80,65 50,60 C 30,58 20,40 10,20 Z" fill="url(#featherGrad)" stroke="#4a5568" stroke-width="1.5"/>

    <!-- Tail Feathers -->
    <path d="M -20,50 L -30,95 L 0,80 L 30,95 L 20,50 Z" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <path d="M -12,55 L -18,105 L 0,90 L 18,105 L 12,55 Z" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>

    <!-- Central Body -->
    <path d="M 0,-40 C -22,-25 -25,20 -18,52 C -10,62 10,62 18,52 C 25,20 22,-25 0,-40 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>

    <!-- Raven Head & Sharp Beak -->
    <path d="M 0,-40 C -8,-45 -12,-55 -8,-65 C -2,-72 8,-72 12,-65 C 16,-55 10,-45 0,-40 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- Raven Beak (Pointed downward left/forward) -->
    <path d="M -6,-60 L -28,-62 C -20,-56 -12,-54 -6,-54 Z" fill="url(#cyberGold)" stroke="#d97706" stroke-width="1"/>
    <!-- Raven Eye (Red/Gold Cyan Tactical Sensor) -->
    <circle cx="-3" cy="-62" r="2.5" fill="#38bdf8"/>
    <circle cx="-3" cy="-62" r="1" fill="#ffffff"/>

    <!-- ★ Three Claws / Legs of Yatagarasu (三本足) ★ -->
    <!-- Leg 1: Left Claw -->
    <g id="left-claw" stroke="url(#cyberGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -12,48 L -20,68 L -28,78"/>
      <path d="M -20,68 L -20,80"/>
      <path d="M -20,68 L -14,79"/>
      <!-- Back spur -->
      <path d="M -20,68 L -16,63"/>
    </g>

    <!-- Leg 2: Center Claw (The Iconic Third Leg) -->
    <g id="center-claw" stroke="url(#cyberGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0,52 L 0,72 L -7,84"/>
      <path d="M 0,72 L 0,86"/>
      <path d="M 0,72 L 7,84"/>
      <!-- Back spur -->
      <path d="M 0,72 L 0,66"/>
    </g>

    <!-- Leg 3: Right Claw -->
    <g id="right-claw" stroke="url(#cyberGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12,48 L 20,68 L 14,79"/>
      <path d="M 20,68 L 20,80"/>
      <path d="M 20,68 L 28,78"/>
      <!-- Back spur -->
      <path d="M 20,68 L 16,63"/>
    </g>

    <!-- Tactical Circuit Traces on Wings -->
    <path d="M -90,15 L -60,25 L -30,22" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" fill="none"/>
    <circle cx="-90" cy="15" r="2" fill="#38bdf8"/>
    <path d="M 90,15 L 60,25 L 30,22" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" fill="none"/>
    <circle cx="90" cy="15" r="2" fill="#38bdf8"/>
  </g>

  <!-- Title & Subtitle Typography -->
  <text x="300" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#f8fafc">
    YTAGARASU
  </text>
  <text x="300" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#94a3b8">
    AIR-GAP AUTONOMOUS DEPLOYMENT PLATFORM
  </text>

  <!-- Three-Legged Raven Badge / Watermark -->
  <rect x="250" y="276" width="100" height="15" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="287" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#38bdf8">
    [ 3-LEGGED RAVEN ]
  </text>
</svg>
