version: "1.0"
metadata:
  name: "musubi-airgap-docker-hybrid"
  description: "Air-Gapped Deployment Bundle Exported to USB for Musubi and Containerized PostgreSQL & Grafana"
  environment: "airgap-usb"

# 1. First-class declarative Docker containers managed and supervised by ytagarasu
containers:
  - name: postgres
    image: postgres:16-alpine
    imageArchive: images/postgres.tar
    ports:
      - "5432:5432"
    volumes:
      - "./data/postgres:/var/lib/postgresql/data"
    environment:
      POSTGRES_DB: musubi
      POSTGRES_USER: musubi
      POSTGRES_PASSWORD: musubi_secret
    network: bridge
    restartPolicy: always
    logPath: "./logs/postgres-docker.log"

  - name: grafana
    image: grafana/grafana:10.4.0
    imageArchive: images/grafana.tar
    ports:
      - "3000:3000"
    volumes:
      - "./data/grafana:/var/lib/grafana"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    network: bridge
    restartPolicy: always
    healthEndpoint: "http://127.0.0.1:3000/api/health"
    logPath: "./logs/grafana-docker.log"

processes:
  # 2. Native Musubi Core Server connecting to supervised PostgreSQL container
  - name: musubi-server
    binary: ./bin/musubi-server
    work_dir: .
    env:
      PORT: "18080"
      SNMP_TRAP_PORT: "10162"
      DATABASE_DRIVER: "postgres"
      DATABASE_DSN: "postgres://musubi:musubi_secret@127.0.0.1:5432/musubi?sslmode=disable"
      BACKUP_ENABLED: "false"
    auto_restart: true
    max_retries: 5
    listen_port: 18080
    health_endpoint: "http://127.0.0.1:18080/v1/system/healthz"
    rollback_on_error: true
    escape_hatch_mode: true
    log_path: "./logs/musubi-server.log"
    log_max_size_mb: 50
    log_max_backups: 5
    log_compress: true

  # 3. Native Musubi HTMX Web Dashboard connecting to Core Server
  - name: musubi-web
    binary: ./bin/musubi-web
    work_dir: .
    env:
      PORT: "13001"
      MUSUBI_API_URL: "http://127.0.0.1:18080"
    auto_restart: true
    max_retries: 5
    listen_port: 13001
    health_endpoint: "http://127.0.0.1:13001/healthz"
    rollback_on_error: true
    escape_hatch_mode: true
    log_path: "./logs/musubi-web.log"
    log_max_size_mb: 50
    log_max_backups: 5
    log_compress: true
