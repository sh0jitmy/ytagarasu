version: "1.0"
processes:
  - name: demo-api
    binary: ./demo/bin/local-demo-api
    args: ["-port", "8081"]
    work_dir: .
    auto_restart: true
    max_restarts: 5
    listen_port: 8081
    health_endpoint: "http://localhost:8081/healthz"
    rollback_on_error: true
    escape_hatch_mode: true

  - name: demo-worker
    binary: ./demo/bin/local-demo-worker
    work_dir: .
    auto_restart: true
    max_restarts: 5
    rollback_on_error: true
    escape_hatch_mode: true
