version: "1.0"
processes:
  - name: demo-api
    binary: /app/bin/demo-api
    args: ["-port", "8080"]
    work_dir: /app
    auto_restart: true
    max_retries: 5
    listen_port: 8080
    health_endpoint: "http://localhost:8080/healthz"
    rollback_on_error: true
    escape_hatch_mode: true

  - name: demo-worker
    binary: /app/bin/demo-worker
    work_dir: /app
    auto_restart: true
    max_retries: 5
    rollback_on_error: true
    escape_hatch_mode: true
