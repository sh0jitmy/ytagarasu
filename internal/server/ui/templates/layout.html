<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}ytagarasu | オフラインデプロイ基盤{{ end }}</title>
  <link rel="stylesheet" href="/ui/static/css/dashboard.css">
  <script src="/ui/static/js/htmx.min.js"></script>
  <style>
    /* Additional custom styling for ytagarasu dashboard */
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-primary);
      text-decoration: none;
      letter-spacing: -0.025em;
    }
    .brand-badge .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent-primary), var(--purple));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      box-shadow: var(--shadow-glow);
    }
    .nav-links {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text-primary);
      background-color: var(--bg-surface-elevated);
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .metric-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-default);
    }
    .metric-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .metric-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }
    .metric-sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .badge-success {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge-warning {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .badge-info {
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .table-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
    }
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .custom-table th {
      background-color: var(--bg-surface-elevated);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .custom-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.875rem;
    }
    .custom-table tr:last-child td {
      border-bottom: none;
    }
    .custom-table tr:hover td {
      background-color: rgba(255, 255, 255, 0.02);
    }
    .mono {
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    .upload-zone {
      border: 2px dashed var(--border-default);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      text-align: center;
      background: var(--bg-surface);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .upload-zone:hover {
      border-color: var(--accent-primary);
      background-color: var(--bg-surface-elevated);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.875rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background-color: var(--accent-primary);
      color: #0b0f19;
    }
    .btn-primary:hover {
      background-color: var(--accent-primary-hover);
    }
    .btn-secondary {
      background-color: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
    }
    .btn-secondary:hover {
      background-color: var(--border-default);
    }
    .htmx-indicator {
      display: none;
    }
    .htmx-request .htmx-indicator {
      display: inline-block;
    }

    /* Modal Dialog Styling */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 15, 25, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.15s ease-out;
    }
    .modal-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 760px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg), 0 0 30px rgba(56, 189, 248, 0.1);
      animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      background: var(--bg-surface-elevated);
      border-bottom-left-radius: var(--radius-lg);
      border-bottom-right-radius: var(--radius-lg);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* Toast Notification Styling */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 2000;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 300px;
      max-width: 480px;
      animation: toastSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <header style="background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); padding: 0.75rem 2rem;">
    <div style="max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
      <a href="/ui" class="brand-badge">
        <span class="logo-icon">🦅</span>
        <span>ytagarasu</span>
      </a>
      <nav class="nav-links">
        <a href="/ui" class="nav-link {{ if eq .ActiveTab "dashboard" }}active{{ end }}">📊 ダッシュボード</a>
        <a href="/ui/audit" class="nav-link {{ if eq .ActiveTab "audit" }}active{{ end }}">🛡️ 監査ログ & 改ざん検証</a>
        <a href="/healthz" target="_blank" class="nav-link">🩺 ヘルスチェック</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 1400px; margin: 2rem auto; padding: 0 2rem; flex: 1;">
    {{ block "content" . }}{{ end }}
  </main>

  <!-- Modal Dialog Container (HTMX swapped) -->
  <div id="modal-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <footer style="background: var(--bg-surface); border-top: 1px solid var(--border-subtle); padding: 1.5rem 2rem; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
    <p>ytagarasu - エアギャップ環境向け高信頼オフラインデプロイ基盤 (CGO-free WAL SQLite & CAS)</p>
  </footer>
</body>
</html>
