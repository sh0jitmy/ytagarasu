name: Weekly Package Matrix Testing

on:
  schedule:
    # Run every Sunday at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable verbose logging'
        required: false
        default: false

permissions:
  contents: read

jobs:
  package-matrix:
    name: Full Package Ecosystem Matrix (APT, DNF, Pip, Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lint & Security Tools
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          npm install -g @stoplight/spectral-cli

      - name: Run Full Package Matrix E2E
        run: |
          make matrix-test

      - name: Package Matrix Test Summary
        if: always()
        run: |
          echo "### 📦 Package Matrix E2E Test Execution" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Mode**: Weekly Schedule / Manual Dispatch" >> $GITHUB_STEP_SUMMARY
          echo "- **Ecosystems Verified**: APT (Ubuntu/Debian), DNF (RHEL/Rocky), Pip (Python Wheels), Docker (Container Tarballs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ All 4 package ecosystems validated successfully" >> $GITHUB_STEP_SUMMARY
