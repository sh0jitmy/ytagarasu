name: ✨ 機能要望 (Feature Request) [JA]
description: 新機能や改善の提案を日本語で行います。
title: "[FEATURE]: 短い要約"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新機能や改善のアイデアをお寄せください。
        (For English issue template, please select "✨ Feature Request [EN]").

  - type: textarea
    id: summary
    attributes:
      label: 📝 提案の概要
      description: 追加したい機能や改善内容を簡潔に説明してください。
      placeholder: |
        Desired State差分検知における安全確認ダイアログの改善。
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 💡 動機・背景
      description: なぜこの機能が必要ですか？ どのような課題を解決しますか？
      placeholder: |
        オンプレミス環境における深夜障害対応時、誤った承認によるダウンタイムを防止するため。
    validations:
      required: true

  - type: checkboxes
    id: category
    attributes:
      label: 📦 影響範囲
      description: この提案が影響するカテゴリを選択してください。
      options:
        - label: "CLI & Supervisor (cmd/ytg, pkg/supervisor)"
        - label: "バンドル & 暗号署名 (internal/bundle, internal/manifest)"
        - label: "パッケージエンジン (internal/pkgengine, internal/agent)"
        - label: "成果物サーバー & HTMX UI (cmd/ytagarasu-server, internal/server)"
        - label: "マニフェスト差分 & 作成支援 (internal/delta, internal/discover)"
        - label: "CI / CD & GitHub Actions"
        - label: "ドキュメント / テンプレート"

  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 代替案の検討
      description: 他に検討した方法があれば記載してください。
      placeholder: |
        代替案1: CLIフラグのみで制御する。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 📎 補足情報
      description: 参考資料、関連 Issue、スクリーンショットなどがあれば記載してください。
    validations:
      required: false
